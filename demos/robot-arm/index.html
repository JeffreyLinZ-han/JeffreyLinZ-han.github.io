<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W-D1 Robot Arm — Interactive Model</title><link rel="stylesheet" href="../../assets/css/hq-demo.css"></head>
<body>
<div class="demo-shell">
  <div class="viewport" id="viewport">
    <img class="viewer-poster" id="viewer-poster" src="../../assets/img/arm2.webp" alt="W-D1 robot arm">
    <canvas class="glcanvas" id="glcanvas" tabindex="0" aria-label="W-D1 robot 3D view. Drag to orbit, pinch or scroll to zoom. Arrow keys rotate; Home fits the model."></canvas>
    <div class="viewer-busy" id="viewer-busy" aria-hidden="true"></div>
    <div class="demo-top"><a class="demo-button" href="../../projects/robot-arm.html">← Project</a><button class="demo-button" id="reset" type="button">Reset</button><button class="demo-button" id="orbit" type="button" aria-pressed="false">Orbit</button><button class="demo-button" id="full" type="button">Fullscreen</button></div>
    <div class="status" id="status" role="status">Loading model…</div>
    <div class="zoom-controls"><button class="demo-button" id="zoom-out" type="button" aria-label="Zoom out">−</button><button class="demo-button" id="zoom-in" type="button" aria-label="Zoom in">+</button></div>
    <div class="error-banner" id="error" role="alert"><span id="error-message"></span><button class="demo-button" id="retry" type="button">Retry</button></div>
  </div>
  <aside class="demo-panel">
    <h1>W-D1 robot arm</h1>
    <p>Move the joints, explore the assembly, or ask the arm to trace a line of text.</p>
    <div class="panel-actions"><button class="demo-button primary" id="demo" type="button" aria-pressed="false">Motion demo</button><button class="demo-button" id="fit" type="button">Fit model</button></div>
    <section class="panel-section"><h2>Joint controls</h2><div id="controls"></div></section>
    <section class="writer-box"><h2>Handwriting</h2><div class="writer-row"><input id="write-text" maxlength="28" value="HELLO WORLD" aria-label="Text for the robot to write"></div><div class="writer-actions"><button class="demo-button light" id="write" type="button">Write</button><button class="demo-button" id="stop-write" type="button">Stop</button><button class="demo-button" id="clear-ink" type="button">Clear</button></div><div class="writer-status" id="write-status" role="status">Ready</div></section>
    <p class="hint">Drag to orbit. Shift-drag or right-drag to pan. Pinch or scroll to zoom.</p>
  </aside>
</div>
<script src="../../assets/js/hq-webgl-viewer.js"></script><script src="../../assets/js/robot-writer.js"></script>
<script>
(() => {
  let viewer,writer;
  const demo=document.getElementById('demo');
  const stop=()=>{writer?.stop();demo.textContent='Motion demo';demo.setAttribute('aria-pressed','false');};
  const load=async()=>{document.getElementById('error').classList.remove('show');try{await viewer.load('model.json');writer=new RobotWriterWeb(viewer);}catch(error){HQDemo.error(error);}};
  try {
    viewer=new HQViewer({});window.viewer=viewer;HQDemo.bind(viewer,{onReset:stop});
    demo.onclick=()=>{writer?.stop();if(viewer.demoOn){viewer.stopDemo();stop();}else{viewer.startDemo();demo.textContent='Stop motion';demo.setAttribute('aria-pressed','true');}};
    document.getElementById('controls').addEventListener('input',stop);
    document.getElementById('write').addEventListener('click',()=>{demo.textContent='Motion demo';demo.setAttribute('aria-pressed','false');});
    document.getElementById('retry').onclick=load;load();
  }catch(error){HQDemo.error(error);document.getElementById('retry').onclick=()=>location.reload();}
})();
</script>
</body></html>
