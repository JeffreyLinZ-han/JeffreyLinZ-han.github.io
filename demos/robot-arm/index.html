<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custom 6-DOF Robot Arm — Interactive Digital Twin</title><link rel="stylesheet" href="../../assets/css/hq-demo.css"></head><body>
<div class="demo-shell"><div class="viewport" id="viewport"><img class="viewer-poster" id="viewer-poster" src="../../assets/img/arm2.webp" alt="Custom robot arm"><canvas class="glcanvas" id="glcanvas"></canvas><div class="viewer-busy" id="viewer-busy"></div><div class="demo-top"><button class="demo-button" id="back">← Portfolio</button><button class="demo-button" id="reset">Reset</button><button class="demo-button primary" id="demo">Showcase</button><button class="demo-button" id="full">Fullscreen</button></div><div class="status" id="status"></div><div class="error-banner" id="error"></div></div>
<aside class="demo-panel"><div class="eyebrow">Interactive Model</div><h1>Custom 6-DOF Robot Arm</h1><p>Explore the robot, adjust each joint, or enter text to preview the handwriting trajectory.</p><div id="controls"></div><div class="writer-box"><div class="section-label">Handwriting</div><div class="writer-row"><input id="write-text" maxlength="28" value="HELLO WORLD" aria-label="Text to write"></div><div class="writer-actions"><button class="demo-button light" id="write">Write</button><button class="demo-button" id="stop-write">Stop</button><button class="demo-button" id="clear-ink">Clear ink</button></div><div class="writer-status" id="write-status">Ready</div></div><div class="hint">Left-drag to orbit · Right-drag to pan · Scroll to zoom.</div></aside></div>
<script src="../../assets/js/hq-webgl-viewer.js"></script><script src="../../assets/js/robot-writer.js"></script><script>
(async()=>{const err=document.getElementById('error');try{const v=new HQViewer({});await v.load('model.json');window.viewer=v;new RobotWriterWeb(v);document.getElementById('back').onclick=()=>location.href='../../projects/robot-arm.html';document.getElementById('reset').onclick=()=>v.reset();document.getElementById('full').onclick=()=>document.getElementById('viewport').requestFullscreen?.();const b=document.getElementById('demo');b.onclick=()=>{if(v.demoOn){v.stopDemo();b.textContent='Showcase'}else{v.startDemo();b.textContent='Stop demo'}};}catch(e){console.error(e);document.getElementById('viewer-busy').classList.add('hide');err.textContent='The 3D model could not load. Refresh the page and try again.';err.classList.add('show');}})();
</script></body></html>
