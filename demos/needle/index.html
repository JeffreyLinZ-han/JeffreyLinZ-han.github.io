<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MRI-Compatible Needle Robot — Interactive CAD</title><link rel="stylesheet" href="../../assets/css/hq-demo.css"></head><body>
<div class="demo-shell"><div class="viewport" id="viewport"><img class="viewer-poster" id="viewer-poster" src="../../assets/img/needle1.webp" alt="MRI-compatible needle robot CAD"><canvas class="glcanvas" id="glcanvas"></canvas><div class="viewer-busy" id="viewer-busy"></div><div class="demo-top"><button class="demo-button" id="back">← Portfolio</button><button class="demo-button" id="reset">Reset view</button><button class="demo-button" id="full">Fullscreen</button></div><div class="viewer-brand">Medical Robotics</div><div class="status" id="status">Ready</div><div class="error-banner" id="error"></div></div>
<aside class="demo-panel"><div class="eyebrow">Interactive CAD</div><h1>MRI-Compatible Needle Intervention Platform</h1><p>Inspect the complete platform or focus on the actuator assembly. Inspect the complete platform or focus on the actuator assembly.</p><div class="model-tabs"><a class="demo-button light" id="full-tab" href="?view=full">Full assembly</a><a class="demo-button light" id="act-tab" href="?view=actuator">Actuator</a></div><div class="hint">Left-drag to orbit · Right-drag to pan · Scroll to zoom</div></aside></div>
<script src="../../assets/js/hq-webgl-viewer.js"></script><script>
(async()=>{const err=document.getElementById('error');try{const params=new URLSearchParams(location.search);const which=params.get('view')==='actuator'?'actuator':'full';document.getElementById(which==='full'?'full-tab':'act-tab').classList.add('active');const v=new HQViewer({controls:null});window.viewer=v;await v.load(`models/${which}-fresh.json`);document.getElementById('back').onclick=()=>location.href='../../projects/needle.html';document.getElementById('reset').onclick=()=>v.reset();document.getElementById('full').onclick=()=>document.getElementById('viewport').requestFullscreen?.();}catch(e){console.error(e);document.getElementById('viewer-busy').classList.add('hide');err.textContent='Interactive view could not start. Try refreshing the page.';err.classList.add('show');}})();
</script></body></html>
