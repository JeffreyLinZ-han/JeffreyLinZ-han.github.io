<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MRI Needle Robot — Interactive CAD</title><link rel="stylesheet" href="../../assets/css/hq-demo.css"></head><body>
<div class="demo-shell"><div class="viewport" id="viewport"><img class="viewer-poster" id="viewer-poster" src="../../assets/img/needle1.webp" alt="MRI-compatible needle robot CAD"><canvas class="glcanvas" id="glcanvas"></canvas><div class="viewer-busy" id="viewer-busy"></div><div class="demo-top"><button class="demo-button" id="back">← Portfolio</button><button class="demo-button" id="reset">Reset view</button><button class="demo-button" id="full">Fullscreen</button></div><div class="status" id="status">Interactive CAD</div><div class="error-banner" id="error"></div></div>
<aside class="demo-panel"><div class="eyebrow">Interactive CAD</div><h1>MRI-Compatible Needle Intervention Platform</h1><p>Inspect the complete mechanism or focus on the actuator assembly.</p><div class="model-tabs"><button class="demo-button light active" data-model="models/full.json">Full assembly</button><button class="demo-button light" data-model="models/actuator.json">Actuator</button></div><div class="hint">Drag to rotate · Right-drag to pan · Scroll to zoom</div></aside></div>
<script src="../../assets/js/hq-webgl-viewer.js?v=4"></script><script>
(async()=>{const err=document.getElementById('error');try{const v=new HQViewer({controls:null});window.viewer=v;const load=async url=>{document.getElementById('viewer-poster').classList.remove('hide');document.getElementById('viewer-busy').classList.remove('hide');await v.load(url);};await load('models/full.json');document.getElementById('back').onclick=()=>location.href='../../projects/needle.html';document.getElementById('reset').onclick=()=>v.reset();document.getElementById('full').onclick=()=>document.getElementById('viewport').requestFullscreen?.();document.querySelectorAll('[data-model]').forEach(b=>b.onclick=async()=>{document.querySelectorAll('[data-model]').forEach(x=>x.classList.remove('active'));b.classList.add('active');await load(b.dataset.model);});}catch(e){console.error(e);document.getElementById('viewer-busy').classList.add('hide');err.textContent='3D viewer unavailable. Please refresh the page.';err.classList.add('show');}})();
</script></body></html>
