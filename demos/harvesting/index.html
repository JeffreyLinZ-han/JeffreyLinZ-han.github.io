<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Berry Harvesting Robot — Interactive Model</title><link rel="stylesheet" href="../../assets/css/hq-demo.css"></head><body>
<div class="demo-shell"><div class="viewport" id="viewport"><img class="viewer-poster" id="viewer-poster" src="../../assets/img/harvest2.webp" alt="Berry harvesting robot"><canvas class="glcanvas" id="glcanvas"></canvas><div class="viewer-busy" id="viewer-busy"></div><div class="demo-top"><button class="demo-button" id="back">← Portfolio</button><button class="demo-button" id="reset">Reset</button><button class="demo-button primary" id="demo">Showcase</button><button class="demo-button" id="full">Fullscreen</button></div><div class="viewer-brand">BM2 · Georgia Tech</div><div class="status" id="status">Ready</div><div class="error-banner" id="error"></div></div>
<aside class="demo-panel"><div class="eyebrow">Interactive Robot Model</div><h1>Berry Harvesting Robot</h1><p>Explore the manipulator architecture developed from the project’s MuJoCo model, including the mobile platform, telescoping arm, wrist, and multi-link gripper.</p><div id="controls"></div><div class="hint">Left-drag to orbit · Right-drag to pan · Scroll to zoom</div></aside></div>
<script src="../../assets/js/hq-webgl-viewer.js"></script><script>
(async()=>{const err=document.getElementById('error');try{const v=new HQViewer({});await v.load('model.json');window.viewer=v;document.getElementById('back').onclick=()=>location.href='../../projects/harvesting.html';document.getElementById('reset').onclick=()=>v.reset();document.getElementById('full').onclick=()=>document.getElementById('viewport').requestFullscreen?.();const b=document.getElementById('demo');b.onclick=()=>{if(v.demoOn){v.stopDemo();b.textContent='Showcase'}else{v.startDemo();b.textContent='Stop'}};}catch(e){console.error(e);document.getElementById('viewer-busy').classList.add('hide');err.textContent='Interactive view could not start. Try refreshing the page.';err.classList.add('show');}})();
</script></body></html>
